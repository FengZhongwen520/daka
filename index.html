<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✊</text></svg>" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2DD4A8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>daka - 新标签页</title>
    <script>
      try {
        if (localStorage.getItem('theme-mode') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #F1ECE2;
      }
      html.dark, html.dark body {
        background: #262A32;
      }
      .boot-loader {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #F1ECE2;
        color: #1F2430;
        opacity: 0;
        visibility: hidden;
        animation: boot-appear 0s linear 140ms forwards;
        transition: opacity 150ms ease, visibility 0s linear 150ms;
        pointer-events: none;
      }
      html.dark .boot-loader {
        background: #262A32;
        color: #E6E9EE;
      }
      .boot-brand {
        display: flex;
        align-items: baseline;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 1.55rem;
        font-weight: 760;
        letter-spacing: -0.075em;
        line-height: 1;
      }
      .boot-dot {
        color: #2DD4A8;
        margin-left: 1px;
      }
      .boot-line {
        position: relative;
        width: 72px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(31, 36, 48, 0.08);
      }
      html.dark .boot-line {
        background: rgba(255, 255, 255, 0.09);
      }
      .boot-line::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: #2DD4A8;
        transform-origin: left center;
        animation: boot-progress 1.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .boot-loader.is-hiding {
        animation: none;
        opacity: 0;
        visibility: hidden;
      }
      @keyframes boot-appear {
        to { opacity: 1; visibility: visible; }
      }
      @keyframes boot-progress {
        0% { transform: translateX(-100%) scaleX(0.3); }
        55% { transform: translateX(0) scaleX(0.72); }
        100% { transform: translateX(100%) scaleX(0.3); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-line::after {
          animation: none;
          transform: none;
          opacity: 0.7;
        }
        .boot-loader {
          animation: boot-appear 0s linear 140ms forwards;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-xPq-QrAU.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/dexie-CSC0e_LZ.js">
    <link rel="modulepreload" crossorigin href="./assets/vue-BoY2KQEQ.js">
    <link rel="stylesheet" crossorigin href="./assets/index-BKQv8xmO.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-loader" class="boot-loader" role="status" aria-label="正在打开 Dake">
      <div class="boot-brand"><span>daka</span><span class="boot-dot">.</span></div>
      <span class="boot-line" aria-hidden="true"></span>
    </div>
  </body>
</html>
