<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./yechao-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./yechao-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2DD4A8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页巢 - 新标签页</title>
    <script>
      try {
        var storedTheme = localStorage.getItem('theme-mode')
        var followsSystem = storedTheme !== 'light' && storedTheme !== 'dark'
        var dark = storedTheme === 'dark'
          || (followsSystem && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {}
    </script>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #F1ECE2;
      }
      html.dark, html.dark body {
        background: #262A32;
      }
      .boot-loader {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #F1ECE2;
        color: #1F2430;
        opacity: 0;
        visibility: hidden;
        animation: boot-appear 0s linear 140ms forwards;
        transition: opacity 150ms ease, visibility 0s linear 150ms;
        pointer-events: none;
      }
      html.dark .boot-loader {
        background: #262A32;
        color: #E6E9EE;
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 1.5rem;
        font-weight: 760;
        line-height: 1;
      }
      .boot-mark {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        filter: drop-shadow(0 8px 18px rgba(15, 23, 42, 0.16));
      }
      .boot-mark img { width: 100%; height: 100%; display: block; object-fit: contain; }
      .boot-copy { display: flex; flex-direction: column; gap: 4px; }
      .boot-word {
        font-size: 1.5rem;
        font-weight: 790;
        letter-spacing: -0.02em;
        line-height: 0.86;
      }
      .boot-tagline {
        color: #9CA3AF;
        font-size: 0.5rem;
        font-weight: 720;
        letter-spacing: 0.13em;
        line-height: 1;
      }
      .boot-line {
        position: relative;
        width: 72px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(31, 36, 48, 0.08);
      }
      html.dark .boot-line {
        background: rgba(255, 255, 255, 0.09);
      }
      .boot-line::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: #2DD4A8;
        transform-origin: left center;
        animation: boot-progress 1.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .boot-loader.is-hiding {
        animation: none;
        opacity: 0;
        visibility: hidden;
      }
      @keyframes boot-appear {
        to { opacity: 1; visibility: visible; }
      }
      @keyframes boot-progress {
        0% { transform: translateX(-100%) scaleX(0.3); }
        55% { transform: translateX(0) scaleX(0.72); }
        100% { transform: translateX(100%) scaleX(0.3); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-line::after {
          animation: none;
          transform: none;
          opacity: 0.7;
        }
        .boot-loader {
          animation: boot-appear 0s linear 140ms forwards;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-loader" class="boot-loader" role="status" aria-label="正在打开页巢">
      <div class="boot-brand">
        <span class="boot-mark" aria-hidden="true">
          <img src="./yechao-icon.png" alt="" />
        </span>
        <span class="boot-copy">
          <span class="boot-word">页巢</span>
          <span class="boot-tagline">PAGE NEST</span>
        </span>
      </div>
      <span class="boot-line" aria-hidden="true"></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
