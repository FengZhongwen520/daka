<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✊</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>daka - 新标签页</title>
    <style>
      .app-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; background: #f0f4f3; z-index: 0;
      }
      .loader-emoji { font-size: 64px; animation: loader-wave 0.6s ease; }
      .loader-text { font-size: 1.6rem; font-weight: 700; color: #999; letter-spacing: 2px; }
      @keyframes loader-wave { 0%,100%{transform:rotate(0)} 25%{transform:rotate(20deg)} 50%{transform:rotate(-10deg)} 75%{transform:rotate(15deg)} }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loader">
        <span class="loader-emoji">👋</span>
        <span class="loader-text">你好</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
